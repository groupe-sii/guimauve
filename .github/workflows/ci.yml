name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: |
          uv run ruff check src
          uv run ruff format --check src

      - name: Mypy
        run: uv run mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xclip libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxkbcommon-x11-0 libegl1

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: src/guimauve/detection/paddleocr
          key: paddleocr-models-${{ hashFiles('src/guimauve/detection/ocr.py') }}

      - name: Install dependencies
        run: uv sync --frozen --group dev --python ${{ matrix.python-version }}

      - name: Pytest
        if: runner.os == 'Windows'
        run: uv run pytest

      - name: Pytest (virtual X11 display)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5

      - name: Build wheel
        run: uv build

      - name: Check dist
        run: uvx twine check dist/*
