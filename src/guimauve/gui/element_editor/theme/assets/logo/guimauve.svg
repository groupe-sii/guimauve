<!-- Guimauve logo, direction D1 (overlap), bright tones; one version for light and dark backgrounds. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <rect x="8" y="18" width="58" height="48" rx="19" fill="#D8679F"/>
  <rect x="34" y="36" width="58" height="48" rx="19" fill="#9A7DE0"/>
  <!-- Overlap of the two shapes, drawn as a path since Qt SVG ignores clip paths. -->
  <path d="M53 36 H66 V47 A19 19 0 0 1 47 66 H34 V55 A19 19 0 0 1 53 36 Z" fill="#7350B3"/>
</svg>
